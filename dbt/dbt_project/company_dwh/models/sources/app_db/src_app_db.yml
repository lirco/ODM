version: 2


sources:
 - name: app_db
   database: houhou_raw_data
   schema: appdb
   tables:
    - name: owners
      identifier: owners
      description: "owners data"
    - name: pets
      identifier: pets
      description: "pets data"
    - name: pet_types
      identifier: pets_types
      description: "pets type id translated to pet type and sub-type names. for example type_id = 1 is type_name 'Dog' and sub_type_name 'Husky' "
    - name: posts
      identifier: posts
      description: "feed posts"